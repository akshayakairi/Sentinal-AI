services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelai-postgres
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinelai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sentinelai-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: SentinelAI API
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sentinelai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-before-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      RAG_TOP_K: 3
      RAG_RETRIEVER: ${RAG_RETRIEVER:-memory}
      CHROMA_PERSIST_DIRECTORY: /app/.sentinelai/chroma
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/.sentinelai

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: sentinelai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  chroma_data:
